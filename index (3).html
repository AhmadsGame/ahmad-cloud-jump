<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14123a">
<title>Ahmad's Cloud Jump</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one 4:3 sky stage, a short hint line, and a thumb control bar (left/right + jump) on touch screens. */
:root{
  --night:#14123a;
  --sky:#241f5c;
  --gold:#ffc83d;
  --coral:#ff6b5b;
  --mint:#5be3b5;
  --ink:#f4f0ff;
  --muted:#b9b2e6;
  --font-display:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night)}
body{
  margin:0;color:var(--ink);font:500 16px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;min-height:100%;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:400 clamp(20px,4vw,28px)/1.1 var(--font-display);color:var(--gold);margin:0;text-wrap:balance}
.chip{font:700 14px/1 var(--font-body);color:var(--ink);background:var(--sky);border:2px solid #3b3590;border-radius:999px;padding:10px 14px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.chip:focus-visible,.btn:focus-visible,.pb:focus-visible,.jb:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.stage{position:relative;border-radius:18px;overflow:hidden;border:3px solid #3b3590;background:#5ab6ff;aspect-ratio:4/3;max-width:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,18,58,.88);text-align:center}
.overlay[hidden]{display:none}
.card{max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.card h1{font:400 clamp(28px,7vw,48px)/1.05 var(--font-display);color:var(--gold);margin:0;text-wrap:balance}
.card p{margin:0;color:var(--ink);font-size:clamp(14px,2.6vw,18px);max-width:52ch;text-wrap:pretty}
.card .sub{color:var(--muted);font-size:clamp(12px,2.2vw,14px)}
.btn{font:400 20px/1 var(--font-display);color:var(--night);background:var(--gold);border:0;border-radius:14px;padding:14px 26px;cursor:pointer;box-shadow:0 5px 0 #b98a10}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b98a10}
.controls{display:none;align-items:center;justify-content:space-between;gap:16px;padding-block:4px}
@media (pointer:coarse),(max-width:700px){.controls{display:flex}.kbd{display:none}}
.pad{display:flex;gap:14px}
.pb{width:84px;height:84px;border-radius:24px;border:3px solid #3b3590;background:var(--sky);color:var(--ink);display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
.pb.on{background:var(--mint);color:var(--night);border-color:var(--mint)}
.jb{width:116px;height:116px;border-radius:50%;border:0;touch-action:none;background:var(--coral);color:#fff;font:400 22px/1 var(--font-display);box-shadow:0 6px 0 #b23d30;flex:none}
.jb.on{transform:translateY(4px);box-shadow:0 2px 0 #b23d30}
.kbd{color:var(--muted);font-size:14px;margin:0;text-align:center}
.kbd b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.btn:active,.jb.on{transform:none}}
</style>
</head>
<body>


<div class="wrap">
  <div class="top">
    <h1 class="brand" id="brand">Ahmad's Cloud Jump</h1>
    <button class="chip" id="mute" type="button" aria-pressed="false">Sound on</button>
  </div>
  <div class="stage">
    <canvas id="c" width="960" height="720" aria-label="Birthday balloon game"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h1 id="ovTitle"></h1>
        <p id="ovText"></p>
        <button class="btn" id="ovBtn" type="button"></button>
        <p class="sub" id="ovSub"></p>
      </div>
    </div>
  </div>
  <p class="kbd"><b>Move</b> A / D or arrow keys &nbsp;·&nbsp; <b>Jump</b> W, Up arrow or Space (hold for a higher jump)</p>
  <div class="controls">
    <div class="pad">
      <button class="pb" id="bl" type="button" aria-label="Move left"><svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="pb" id="br" type="button" aria-label="Move right"><svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <button class="jb" id="jump" type="button" aria-label="Jump">JUMP</button>
  </div>
</div>

<script>
/* ============ EDIT THIS PART TO PERSONALISE ============ */
const CONFIG = {
  name: 'Ahmad',
  target: 600,   // points needed to win
  finaleTitle: 'Happy Birthday, Ahmad!',
  finaleText: 'You popped the balloons and sent Jabu, Puton, Hamza and the whole flock of witches packing. This whole game was made for you. Wishing you a year full of good surprises.',
  from: ''       // e.g. 'From Sami'
};
/* ========================================================= */

const W = 640, H = 480;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
const C = { night:'#14123a', gold:'#ffc83d', coral:'#ff6b5b', mint:'#5be3b5', ink:'#f4f0ff', blue:'#4aa3ff', peach:'#ffd9b8' };
const FD = "'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',sans-serif";
document.getElementById('brand').textContent = CONFIG.name + "'s Cloud Jump";
document.title = CONFIG.name + "'s Cloud Jump";

/* three tiers of cloud platforms: L0 low bank, L1 middle, L2 high */
const PLATS = [
  {x:-10,y:420,w:660,L:0},
  {x:30,y:310,w:170,L:1},{x:235,y:310,w:170,L:1},{x:440,y:310,w:170,L:1},
  {x:100,y:200,w:160,L:2},{x:380,y:200,w:160,L:2}
];
const rand=(a,b)=>a+Math.random()*(b-a);
PLATS.forEach(p=>{
  const n=Math.max(3,Math.floor(p.w/36)); p.bumps=[]; p.under=[];
  for(let i=0;i<n;i++){ p.bumps.push({x:12+(p.w-24)*i/(n-1),r:rand(10,13)}); }
  for(let i=0;i<n-1;i++){ p.under.push({x:20+(p.w-40)*i/(n-2||1),r:rand(11,15)}); }
});

/* enemy types */
const ET = {
  jabu:  {name:'Jabu',  w:40,h:38,hp:2,pts:100,c:'#e6903a',c2:'#f6b866',speed:72},
  puton: {name:'Puton', w:24,h:24,hp:1,pts:50, c:'#2fb3c7',c2:'#7fdcea',speed:0},
  hamza: {name:'Hamza', w:30,h:26,hp:1,pts:75, c:'#d4468a',c2:'#f08ab8',speed:100},
  witch: {name:'Witch', w:34,h:30,hp:1,pts:60, c:'#7b3fc4',c2:'#8fd45a',speed:185}
};
const SEQ = ['witch','puton','witch','jabu','hamza','witch','puton','witch','hamza','witch'];

let state='title', gt=0, score=0, combo=1, lastPop=-9, shake=0, spawnBal=0, spawnEn=2, enN=0;
let player, balloons=[], enemies=[], bolts=[], parts=[], floats=[];
let keys={}, touch={l:false,r:false}, jumpHeld=false, jumpBuf=0, muted=false, actx=null;

/* ---------- background clouds (parallax layers) ---------- */
const BG=[
  {ys:[60,120],n:4,sp:5, sc:.6,a:.5},
  {ys:[140,270],n:4,sp:11,sc:.9,a:.65},
  {ys:[330,420],n:3,sp:20,sc:1.3,a:.8}
].map(l=>({...l,list:Array.from({length:l.n},(_,i)=>({x:i*(W+200)/l.n+rand(-30,30),y:rand(l.ys[0],l.ys[1])}))}));
function puff(x,y,s,a){
  ctx.globalAlpha=a; ctx.fillStyle='#fff'; ctx.beginPath();
  for(const [dx,dy,r] of [[-30,4,18],[-10,-8,24],[14,-4,21],[34,5,16]]){ ctx.moveTo(x+dx*s+r*s,y+dy*s); ctx.arc(x+dx*s,y+dy*s,r*s,0,6.283); }
  ctx.rect(x-30*s,y+4*s,64*s,14*s);
  ctx.fill('nonzero');
  ctx.globalAlpha=1;
}
function drift(dt){ for(const l of BG) for(const c of l.list){ c.x+=l.sp*dt; if(c.x>W+120*l.sc) c.x=-120*l.sc; } }

/* ---------- audio ---------- */
function beep(f,d,type,vol,slide){
  if(muted||!actx) return;
  try{ const o=actx.createOscillator(),g=actx.createGain(); o.type=type||'square'; o.frequency.value=f;
    if(slide) o.frequency.linearRampToValueAtTime(f+slide,actx.currentTime+d);
    g.gain.value=vol||.05; g.gain.linearRampToValueAtTime(0,actx.currentTime+d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d); }catch(e){}
}
const sfx={
  jump:()=>beep(380,.12,'triangle',.05,320),
  pop:c=>beep(520+c*90,.1,'triangle',.07,260),
  stomp:()=>{beep(180,.1,'square',.06,-60);setTimeout(()=>beep(300,.1,'square',.05,120),70)},
  hurt:()=>beep(110,.3,'sawtooth',.08,-60),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.07),i*110))
};
function begin(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }

/* ---------- helpers ---------- */
function burst(x,y,n,colors,spd){ for(let i=0;i<n;i++){ const a=rand(0,6.283),s=rand(40,spd||220); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rand(.5,1),max:1,c:colors[i%colors.length],s:rand(2.5,5.5)}); } }
function say(x,y,t,c){ floats.push({x,y,t,c:c||C.gold,life:1.3}); }
function physics(o,dt,hw,g){
  const py=o.y; o.vy+=g*dt; o.y+=o.vy*dt; o.x+=o.vx*dt; o.ground=null;
  if(o.vy>=0){ for(const pl of PLATS){ if(py<=pl.y+2&&o.y>=pl.y&&o.x+hw>pl.x&&o.x-hw<pl.x+pl.w){ o.y=pl.y; o.vy=0; o.ground=pl; break; } } }
  if(o.x<-12) o.x=W+12; else if(o.x>W+12) o.x=-12;
}

/* ---------- game flow ---------- */
function startGame(){
  player={x:W/2,y:420,vx:0,vy:0,dir:1,hp:3,inv:0,coy:0,ground:PLATS[0],walk:0};
  balloons=[]; enemies=[]; bolts=[]; parts=[]; floats=[]; score=0; combo=1; lastPop=-9; gt=0; spawnBal=.2; spawnEn=1.5; enN=0; state='play';
  for(let i=0;i<5;i++) spawnBalloon(rand(60,400));
}
function lose(){ state='dead'; sfx.hurt(); showOverlay('Oh no!','The gloomy gang got you this time. Birthday heroes always get another try.','Try again',()=>{hideOverlay();startGame()},'Score '+score+' of '+CONFIG.target); }
function win(){
  state='win'; sfx.win(); burst(W/2,200,70,[C.gold,C.coral,C.mint,'#fff',C.blue],340);
  setTimeout(()=>{ if(state==='win') showOverlay(CONFIG.finaleTitle,CONFIG.finaleText,'Play again',()=>{hideOverlay();startGame()},CONFIG.from,.6); },2000);
}

/* ---------- overlay ---------- */
const ov=document.getElementById('overlay'),ovT=document.getElementById('ovTitle'),ovP=document.getElementById('ovText'),ovB=document.getElementById('ovBtn'),ovS=document.getElementById('ovSub');
let ovFn=null;
function showOverlay(t,p,b,fn,sub,alpha){ ovT.textContent=t; ovP.textContent=p; ovB.textContent=b; ovS.textContent=sub||''; ovFn=fn; ov.style.background='rgba(20,18,58,'+(alpha||.88)+')'; ov.hidden=false; ovB.focus({preventScroll:true}); }
function hideOverlay(){ ov.hidden=true; }
ovB.addEventListener('click',()=>{ begin(); if(ovFn) ovFn(); });

/* ---------- input ---------- */
const JUMPKEYS=['w','arrowup',' '];
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(JUMPKEYS.includes(k)&&!e.repeat){ jumpBuf=.14; }
  keys[k]=true;
  if(k==='enter'&&!ov.hidden&&document.activeElement!==ovB) ovB.click();
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ keys={}; touch.l=touch.r=false; jumpHeld=false; });
function hold(el,down,up){
  el.addEventListener('pointerdown',e=>{ begin(); e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add('on'); down(); });
  const off=()=>{ el.classList.remove('on'); up(); };
  el.addEventListener('pointerup',off); el.addEventListener('pointercancel',off); el.addEventListener('lostpointercapture',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
hold(document.getElementById('bl'),()=>touch.l=true,()=>touch.l=false);
hold(document.getElementById('br'),()=>touch.r=true,()=>touch.r=false);
hold(document.getElementById('jump'),()=>{jumpBuf=.14;jumpHeld=true},()=>jumpHeld=false);
document.getElementById('mute').addEventListener('click',e=>{ muted=!muted; e.currentTarget.textContent=muted?'Sound off':'Sound on'; e.currentTarget.setAttribute('aria-pressed',String(muted)); });

/* ---------- spawning ---------- */
function spawnBalloon(y){
  const r=Math.random(); let t;
  if(r<.06) t={c:'#ff5fa8',pts:20,vy:rand(60,80),r:16,heart:true};
  else if(r<.16) t={c:'#ffc83d',pts:40,vy:rand(90,110),r:14};
  else if(r<.5) t={c:'#ff6b5b',pts:10,vy:rand(45,70),r:16};
  else if(r<.8) t={c:'#4aa3ff',pts:15,vy:rand(50,75),r:16};
  else t={c:'#5be3b5',pts:10,vy:rand(45,70),r:16};
  balloons.push({x:rand(30,W-30),y:y===undefined?H+24:y,ph:rand(0,6),t:0,...t});
}
function spawnEnemy(type){
  const T=ET[type]; let x=rand(40,W-40); for(let i=0;i<8&&Math.abs(x-player.x)<110;i++) x=rand(40,W-40);
  const e={type,x,y:(type==='hamza'||type==='witch')?rand(110,250):34,base:0,w:T.w,h:T.h,hp:T.hp,max:T.hp,vx:0,vy:0,dir:Math.random()<.5?-1:1,stun:0,t:rand(0,6),hop:rand(.6,1.1),shoot:rand(1.5,3),ground:null};
  if(type==='witch') e.x=e.dir>0?-30:W+30;
  e.base=e.y; enemies.push(e);
}

/* ---------- update ---------- */
function hurt(from){
  player.hp--; player.inv=1.3; player.vy=-380; player.ground=null; player.vx=(player.x<from.x?-1:1)*230; shake=.25; sfx.hurt(); burst(player.x,player.y-18,10,[C.coral,'#fff'],180);
  if(player.hp<=0) lose();
}
function update(dt){
  dt=Math.min(dt,.033); drift(dt);
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=380*dt; p.life-=dt; } parts=parts.filter(p=>p.life>0);
  for(const f of floats){ f.y-=26*dt; f.life-=dt; } floats=floats.filter(f=>f.life>0);
  if(shake>0) shake-=dt;
  if(state==='win'){ if(Math.random()<.12){ burst(rand(80,W-80),rand(70,260),26,[C.gold,C.coral,C.mint,'#fff'],220); beep(rand(300,600),.12,'triangle',.03,300); } return; }
  if(state!=='play') return;
  gt+=dt; const p=player;

  /* player */
  const dir=((keys.d||keys.arrowright||touch.r)?1:0)-((keys.a||keys.arrowleft||touch.l)?1:0);
  if(dir) p.dir=dir;
  p.vx+=(dir*215-p.vx)*Math.min(1,(p.ground?14:8)*dt);
  jumpBuf=Math.max(0,jumpBuf-dt); p.coy=p.ground?.1:Math.max(0,p.coy-dt);
  if(jumpBuf>0&&p.coy>0){ p.vy=-680; jumpBuf=0; p.coy=0; p.ground=null; sfx.jump(); }
  const jh=jumpHeld||keys.w||keys.arrowup||keys[' '];
  physics(p,dt,10,(!jh&&p.vy<-220)?4200:1700);
  if(p.ground&&Math.abs(p.vx)>20) p.walk+=dt*12;
  p.inv=Math.max(0,p.inv-dt);

  /* balloons */
  spawnBal-=dt; if(spawnBal<=0&&balloons.length<10){ spawnBal=rand(.45,1); spawnBalloon(); }
  for(const b of balloons){
    b.t+=dt; b.y-=b.vy*dt; b.x+=Math.sin(b.t*1.6+b.ph)*18*dt;
    if(Math.hypot(p.x-b.x,p.y-18-b.y)<14+b.r){
      b.dead=true; combo=(gt-lastPop<1.8)?Math.min(5,combo+1):1; lastPop=gt;
      const pts=b.pts*combo; score+=pts; sfx.pop(combo);
      if(b.heart&&p.hp<3){ p.hp++; say(b.x,b.y-30,'Heart restored!',C.coral); }
      burst(b.x,b.y,16,[b.c,C.gold,'#fff'],200); say(b.x,b.y-10,'+'+pts+(combo>1?'  x'+combo:''),combo>1?C.coral:C.gold);
      if(score>=CONFIG.target){ win(); }
    }
  }
  balloons=balloons.filter(b=>!b.dead&&b.y>-40);
  if(state!=='play') return;

  /* enemies */
  spawnEn-=dt; const cap=Math.min(9,3+Math.floor(score/110));
  if(spawnEn<=0&&enemies.length<cap){ spawnEn=rand(2,3.2); spawnEnemy(SEQ[enN++%SEQ.length]); }
  for(const e of enemies){
    e.t+=dt; e.stun=Math.max(0,e.stun-dt);
    const T=ET[e.type];
    if(e.type==='jabu'){
      if(e.ground){ const gp=e.ground; e.vx=e.stun>0?0:e.dir*T.speed; if(e.x>gp.x+gp.w-14&&e.dir>0) e.dir=-1; if(e.x<gp.x+14&&e.dir<0) e.dir=1; }
      physics(e,dt,e.w/2,1700);
      if(e.ground&&e.x>e.ground.x+e.ground.w-8) e.dir=-1;
      if(e.x<12||e.x>W-12) e.dir=-e.dir;
    } else if(e.type==='puton'){
      e.hop-=dt;
      if(e.ground){ e.vx*=Math.max(0,1-10*dt); if(e.hop<=0&&e.stun<=0){ e.hop=rand(.8,1.5); e.vy=-rand(430,620); e.vx=Math.sign(p.x-e.x||1)*rand(90,140); e.ground=null; } }
      physics(e,dt,e.w/2,1700);
    } else if(e.type==='witch'){
      e.x+=e.dir*T.speed*(e.stun>0?.2:1)*dt;
      e.base+=(Math.max(80,Math.min(400,p.y-30))-e.base)*.5*dt; e.y=e.base+Math.sin(e.t*3.2)*38;
      if(e.x<-30) e.x=W+30; else if(e.x>W+30) e.x=-30;
      e.shoot-=dt;
      if(e.shoot<=0&&e.stun<=0&&e.x>20&&e.x<W-20){
        e.shoot=rand(3,4.5); const a=Math.atan2(p.y-18-(e.y-e.h/2),p.x-e.x);
        bolts.push({x:e.x,y:e.y-e.h/2,vx:Math.cos(a)*190,vy:Math.sin(a)*190,life:3}); beep(700,.12,'sawtooth',.03,-300);
      }
    } else {
      e.x+=e.dir*T.speed*(e.stun>0?.2:1)*dt; e.y=e.base+Math.sin(e.t*2.2)*34;
      if(e.x<-20) e.x=W+20; else if(e.x>W+20) e.x=-20;
    }
    if(e.dead) continue;
    /* contact with Ahmad */
    const overlapX=Math.abs(p.x-e.x)<10+e.w/2-2, overlapY=p.y>e.y-e.h&&p.y-36<e.y;
    if(overlapX&&overlapY){
      if(p.vy>0&&p.y<e.y-e.h*.4&&e.stun<=.2){
        e.hp--; e.stun=.5; p.vy=-540; p.ground=null; sfx.stomp(); burst(e.x,e.y-e.h,8,[T.c2,'#fff'],160);
        if(e.hp<=0){ e.dead=true; score+=T.pts; burst(e.x,e.y-e.h/2,22,[T.c2,C.gold,C.mint,C.coral],240); say(e.x,e.y-e.h-22,T.name+' is down!  +'+T.pts); if(score>=CONFIG.target){ win(); break; } }
      } else if(p.inv<=0&&e.stun<=0){ hurt(e); if(state!=='play') break; }
    }
  }
  enemies=enemies.filter(e=>!e.dead);
  if(state==='play'){
    for(const b of bolts){
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
      if(p.inv<=0&&Math.hypot(b.x-p.x,b.y-(p.y-18))<16){ b.life=0; hurt(b); if(state!=='play') break; }
    }
    bolts=bolts.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  }
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#4fa9f5'); g.addColorStop(1,'#cfeeff'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,240,170,.35)'; ctx.beginPath(); ctx.arc(570,96,52,0,6.283); ctx.fill();
  ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.arc(570,96,30,0,6.283); ctx.fill();
  for(const l of BG) for(const c of l.list) puff(c.x,c.y,l.sc,l.a);
}
function drawPlat(pl){
  const cols=[['#cddbf7','#a9bce6'],['#eaf1ff','#c6d4f3'],['#ffffff','#d6e3fb']][pl.L], y=pl.y;
  ctx.fillStyle=cols[1]; for(const b of pl.under){ ctx.beginPath(); ctx.arc(pl.x+b.x,y+24,b.r,0,6.283); ctx.fill(); }
  rr(pl.x+4,y+10,pl.w-8,22,11);
  ctx.fillStyle=cols[0]; rr(pl.x,y+2,pl.w,22,11);
  for(const b of pl.bumps){ ctx.beginPath(); ctx.arc(pl.x+b.x,y+10,b.r,0,6.283); ctx.fill(); }
}
function drawBalloon(b){
  ctx.strokeStyle='rgba(60,60,100,.55)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(b.x,b.y+b.r+4);
  for(let i=1;i<=4;i++) ctx.lineTo(b.x+Math.sin(b.t*3+i)*3,b.y+b.r+4+i*7); ctx.stroke();
  ctx.fillStyle=b.c; ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r*.86,b.r*1.08,0,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(b.x,b.y+b.r*1.05); ctx.lineTo(b.x-4,b.y+b.r*1.05+6); ctx.lineTo(b.x+4,b.y+b.r*1.05+6); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(b.x-b.r*.3,b.y-b.r*.4,b.r*.2,b.r*.34,-.4,0,6.283); ctx.fill();
  if(b.pts>=40){ ctx.fillStyle='#fff'; ctx.font='700 11px Figtree,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('40',b.x,b.y+1); }
  if(b.heart){ ctx.fillStyle='#fff'; ctx.font='700 15px Figtree,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('♥',b.x,b.y+1); }
}
function drawPlayer(){
  const p=player; if(p.inv>0&&Math.floor(p.inv*14)%2===0) return;
  const bob=p.ground?Math.sin(p.walk)*1.4:0, st=p.ground?1:1+Math.min(.14,Math.abs(p.vy)/4500), cx=p.x, fy=p.y;
  ctx.save(); ctx.translate(cx,fy); ctx.scale(1/st,st); ctx.translate(-cx,-fy);
  ctx.fillStyle='rgba(60,70,110,.18)'; ctx.beginPath(); ctx.ellipse(cx,fy+1,11,3.5,0,0,6.283); ctx.fill();
  ctx.fillStyle=C.coral; ctx.beginPath(); ctx.arc(cx,fy-12+bob,11,0,6.283); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(cx-5,fy-18+bob,10,2);
  ctx.fillStyle=C.peach; ctx.beginPath(); ctx.arc(cx,fy-26+bob,9,0,6.283); ctx.fill();
  ctx.fillStyle='#2b1d4d'; ctx.beginPath(); ctx.arc(cx-3+p.dir*2,fy-27+bob,1.6,0,6.283); ctx.arc(cx+3+p.dir*2,fy-27+bob,1.6,0,6.283); ctx.fill();
  ctx.strokeStyle='#2b1d4d'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(cx+p.dir*1.5,fy-23+bob,3,.2,2.9); ctx.stroke();
  ctx.fillStyle=C.mint; ctx.beginPath(); ctx.moveTo(cx-8,fy-31+bob); ctx.lineTo(cx+8,fy-31+bob); ctx.lineTo(cx,fy-50+bob); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(cx,fy-50+bob,3.2,0,6.283); ctx.fill();
  ctx.restore();
}
function drawWitch(e){
  const T=ET[e.type], flash=e.stun>0&&Math.floor(e.stun*20)%2===0, cx=e.x, cy=e.y-e.h/2;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(e.dir,1);
  ctx.strokeStyle='#8a5a2b'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(-20,8); ctx.lineTo(18,8); ctx.stroke();
  ctx.fillStyle=flash?'#fff':'#d9a441'; ctx.beginPath(); ctx.moveTo(-18,8); ctx.lineTo(-36,0); ctx.lineTo(-36,16); ctx.closePath(); ctx.fill();
  ctx.fillStyle=flash?'#fff':T.c; ctx.beginPath(); ctx.ellipse(-2,0,12,10,0,0,6.283); ctx.fill();
  ctx.fillStyle=flash?'#fff':T.c2; ctx.beginPath(); ctx.arc(8,-8,7,0,6.283); ctx.fill();
  ctx.fillStyle='#1a1038'; ctx.beginPath(); ctx.arc(10.5,-9,1.7,0,6.283); ctx.fill();
  ctx.strokeStyle='#1a1038'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(7,-13); ctx.lineTo(13,-11); ctx.stroke();
  ctx.fillStyle=flash?'#fff':'#2a1647'; ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(18,-13); ctx.lineTo(7,-33); ctx.closePath(); ctx.fill(); ctx.fillRect(-3,-15,24,3);
  ctx.fillStyle=C.gold; ctx.fillRect(4,-19,9,2.5);
  ctx.restore();
  ctx.font='700 11px Figtree,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const tw=ctx.measureText(T.name).width+10, ty=e.y-e.h-34;
  ctx.fillStyle='rgba(20,18,58,.82)'; ctx.fillRect(cx-tw/2,ty,tw,15); ctx.fillStyle=C.ink; ctx.fillText(T.name,cx,ty+11);
}
function drawEnemy(e){
  if(e.type==='witch'){ drawWitch(e); return; }
  const T=ET[e.type], flash=e.stun>0&&Math.floor(e.stun*20)%2===0, rw=e.w/2, rh=e.h/2, cx=e.x, cy=e.y-rh, sq=1+Math.sin(e.t*8)*.05;
  const body=flash?'#fff':T.c, lite=flash?'#fff':T.c2, look=Math.sign(player.x-cx)||1;
  if(e.type!=='hamza'){ ctx.fillStyle='rgba(60,70,110,.18)'; ctx.beginPath(); ctx.ellipse(cx,e.y+1,rw,3.5,0,0,6.283); ctx.fill(); }
  if(e.type==='puton'){ ctx.fillStyle=body; for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(cx+i*rw*.6-4,cy-rh*.7); ctx.lineTo(cx+i*rw*.6,cy-rh*1.45); ctx.lineTo(cx+i*rw*.6+4,cy-rh*.7); ctx.closePath(); ctx.fill(); } }
  if(e.type==='hamza'){ ctx.fillStyle='rgba(255,255,255,.9)'; const fl=Math.sin(e.t*16)*5; ctx.beginPath(); ctx.ellipse(cx-rw-4,cy-4-fl,10,5,-.5,0,6.283); ctx.ellipse(cx+rw+4,cy-4-fl,10,5,.5,0,6.283); ctx.fill(); }
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(cx,cy,rw*sq,rh/sq,0,0,6.283); ctx.fill();
  ctx.fillStyle=lite; ctx.beginPath(); ctx.ellipse(cx-rw*.2,cy-rh*.35,rw*.55,rh*.32,0,0,6.283); ctx.fill();
  if(e.type==='jabu'){ ctx.beginPath(); ctx.ellipse(cx,cy+rh*.45,rw*.62,rh*.4,0,0,6.283); ctx.fill(); }
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx-rw*.34,cy-rh*.1,rw*.24,0,6.283); ctx.arc(cx+rw*.34,cy-rh*.1,rw*.24,0,6.283); ctx.fill();
  ctx.fillStyle='#1a1038'; ctx.beginPath(); ctx.arc(cx-rw*.34+look*rw*.08,cy-rh*.08,rw*.11,0,6.283); ctx.arc(cx+rw*.34+look*rw*.08,cy-rh*.08,rw*.11,0,6.283); ctx.fill();
  ctx.strokeStyle='#1a1038'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.beginPath();
  ctx.moveTo(cx-rw*.62,cy-rh*.5); ctx.lineTo(cx-rw*.15,cy-rh*.32); ctx.moveTo(cx+rw*.62,cy-rh*.5); ctx.lineTo(cx+rw*.15,cy-rh*.32);
  if(e.type==='jabu'){ ctx.moveTo(cx-rw*.4,cy+rh*.45); ctx.quadraticCurveTo(cx,cy+rh*.8,cx+rw*.4,cy+rh*.45); } else { ctx.moveTo(cx-rw*.3,cy+rh*.5); ctx.lineTo(cx+rw*.3,cy+rh*.5); }
  ctx.stroke();
  if(e.type==='hamza'){ ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(cx-rw*.34,cy-rh*.1,rw*.34,0,6.283); ctx.moveTo(cx+rw*.68,cy-rh*.1); ctx.arc(cx+rw*.34,cy-rh*.1,rw*.34,0,6.283); ctx.moveTo(cx-rw*.0,cy-rh*.12); ctx.lineTo(cx+rw*0,cy-rh*.12); ctx.stroke(); }
  ctx.font='700 11px Figtree,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const tw=ctx.measureText(T.name).width+10, ty=e.y-e.h-(e.type==='puton'?14:0)-24;
  ctx.fillStyle='rgba(20,18,58,.82)'; ctx.fillRect(cx-tw/2,ty,tw,15); ctx.fillStyle=C.ink; ctx.fillText(T.name,cx,ty+11);
  if(e.max>1) for(let i=0;i<e.max;i++){ ctx.fillStyle=i<e.hp?C.coral:'rgba(20,18,58,.35)'; ctx.fillRect(cx-e.max*3+i*6,ty+17,5,3); }
}
function drawHUD(){
  ctx.fillStyle='rgba(20,18,58,.8)'; ctx.fillRect(0,0,W,40);
  ctx.textBaseline='middle'; ctx.textAlign='left'; ctx.font='20px '+FD;
  for(let i=0;i<3;i++){ ctx.fillStyle=i<player.hp?C.coral:'rgba(255,255,255,.2)'; ctx.fillText('♥',14+i*26,21); }
  ctx.textAlign='center'; ctx.fillStyle=C.gold; ctx.font='20px '+FD; ctx.fillText('Score '+score+' / '+CONFIG.target,W/2,17);
  ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(W/2-90,29,180,5); ctx.fillStyle=C.mint; ctx.fillRect(W/2-90,29,180*Math.min(1,score/CONFIG.target),5);
  const live=gt-lastPop<1.8&&combo>1; ctx.textAlign='right'; ctx.font='20px '+FD; ctx.fillStyle=live?C.coral:'rgba(255,255,255,.3)'; ctx.fillText('Combo x'+(live?combo:1),W-14,21);
}
function draw(){
  ctx.save(); if(shake>0) ctx.translate(rand(-3,3),rand(-3,3));
  drawSky(); balloons.forEach(drawBalloon);
  PLATS.forEach(drawPlat);
  if(state!=='title'&&player) { enemies.forEach(drawEnemy); drawPlayer(); }
  for(const b of bolts){ ctx.fillStyle='rgba(200,120,255,.35)'; ctx.beginPath(); ctx.arc(b.x,b.y,11,0,6.283); ctx.fill(); ctx.fillStyle='#d58bff'; ctx.beginPath(); ctx.arc(b.x,b.y,6,0,6.283); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,2.2,0,6.283); ctx.fill(); }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.s,p.s*.7); }
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='17px '+FD;
  for(const f of floats){ ctx.globalAlpha=Math.min(1,f.life); ctx.lineWidth=4; ctx.strokeStyle='rgba(20,18,58,.8)'; ctx.strokeText(f.t,f.x,f.y); ctx.fillStyle=f.c; ctx.fillText(f.t,f.x,f.y); }
  ctx.globalAlpha=1; ctx.restore();
  if(state!=='title'&&player) drawHUD();
}

/* ---------- boot ---------- */
function titleScreen(){
  state='title'; player=null;
  showOverlay('Happy Birthday, '+CONFIG.name+'!','Jabu, Puton, Hamza and a flock of fast witches are loose in the clouds. Dodge their sparks, jump into the balloons for points, stomp the troublemakers, and reach '+CONFIG.target+'.','Start the adventure',()=>{ hideOverlay(); startGame(); },'Pop balloons in a row for combos. Pink heart balloons restore a heart.');
}
let last=performance.now();
function loop(now){ const dt=(now-last)/1000; last=now; update(dt); draw(); requestAnimationFrame(loop); }
titleScreen();
if(document.fonts&&document.fonts.load){ document.fonts.load('20px "Bagel Fat One"').catch(()=>{}); }
requestAnimationFrame(loop);
</script>
